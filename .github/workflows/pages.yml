# Deploys the site to GitHub Pages via Actions.
#
# The repository previously used the legacy "deploy from a branch" Pages mode,
# whose builds repeatedly stalled in a queued state with no log and no way to
# cancel or re-run them. This workflow replaces that with the supported
# Actions-based deploy: it runs in the repo's own Actions queue, prints a log,
# and can be re-run by hand when needed.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets a stuck deploy be re-triggered from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is plain static files at the repo root — no build step.
      # node_modules and the local dev/verification scripts are excluded so the
      # published artifact stays small.
      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude 'backup' \
            --exclude 'cargo-calculator-main' \
            --exclude '*.mjs' \
            --exclude '*.py' \
            --exclude '*.bat' \
            --exclude '*.txt' \
            ./ _site/
          echo "--- published files ---"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
